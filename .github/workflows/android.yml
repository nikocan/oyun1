# Her main gönderiminde: testler, web derlemesi ve telefona kurulabilir Android APK.
# APK, Actions sekmesindeki çalıştırmanın "Artifacts" bölümünden indirilir.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tas-ustasi-${{ github.run_number }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
